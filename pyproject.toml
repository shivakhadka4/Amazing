[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "A configurable maze generator with a reproducible seed and solver."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.8"
authors = [
    { name = "Shiva Khadka" },
    { name = "Sanaz Rouhi" },
]
keywords = ["maze", "generator", "algorithm", "42"]

[tool.setuptools]
packages = ["mazegen"]
